<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-hidden="true">
  <title>Warm geometric marketplace backdrop</title>
  <!-- Brand palette: navy / amber / cream / lake. Abstract shops + connection nodes — no food imagery. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0%" stop-color="#141a24"/>
      <stop offset="40%" stop-color="#1a2436"/>
      <stop offset="100%" stop-color="#0b5a54"/>
    </linearGradient>
    <linearGradient id="warm" x1="0.15" y1="0.1" x2="1" y2="0.9">
      <stop offset="0%" stop-color="#c8881a" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#c8881a" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#fbf1dc" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbf1dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="facade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f3ec" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#f7f3ec" stop-opacity="0.08"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" stroke="#f7f3ec" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#warm)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <ellipse cx="1220" cy="160" rx="460" ry="280" fill="url(#glow)"/>
  <ellipse cx="200" cy="760" rx="420" ry="240" fill="#c8881a" fill-opacity="0.2"/>

  <!-- Soft city / shop silhouettes (right half — readable under left-weighted text overlay) -->
  <g>
    <rect x="740" y="430" width="120" height="330" rx="10" fill="url(#facade)"/>
    <rect x="880" y="330" width="150" height="430" rx="10" fill="url(#facade)"/>
    <rect x="1050" y="380" width="130" height="380" rx="10" fill="url(#facade)"/>
    <rect x="1200" y="270" width="175" height="490" rx="10" fill="#f7f3ec" fill-opacity="0.32"/>
    <rect x="1395" y="440" width="140" height="320" rx="10" fill="url(#facade)"/>

    <!-- Amber / teal shop windows -->
    <rect x="905" y="400" width="44" height="54" rx="5" fill="#fbf1dc" fill-opacity="0.55"/>
    <rect x="965" y="400" width="44" height="54" rx="5" fill="#c8881a" fill-opacity="0.7"/>
    <rect x="905" y="480" width="44" height="54" rx="5" fill="#0f766e" fill-opacity="0.65"/>
    <rect x="965" y="480" width="44" height="54" rx="5" fill="#fbf1dc" fill-opacity="0.4"/>
    <rect x="905" y="560" width="44" height="54" rx="5" fill="#fbf1dc" fill-opacity="0.35"/>
    <rect x="965" y="560" width="44" height="54" rx="5" fill="#c8881a" fill-opacity="0.5"/>

    <rect x="1235" y="340" width="48" height="58" rx="5" fill="#c8881a" fill-opacity="0.85"/>
    <rect x="1300" y="340" width="48" height="58" rx="5" fill="#fbf1dc" fill-opacity="0.55"/>
    <rect x="1235" y="425" width="48" height="58" rx="5" fill="#0f766e" fill-opacity="0.75"/>
    <rect x="1300" y="425" width="48" height="58" rx="5" fill="#c8881a" fill-opacity="0.6"/>
    <rect x="1235" y="510" width="48" height="58" rx="5" fill="#fbf1dc" fill-opacity="0.45"/>
    <rect x="1300" y="510" width="48" height="58" rx="5" fill="#0f766e" fill-opacity="0.55"/>

    <rect x="1075" y="450" width="40" height="48" rx="4" fill="#fbf1dc" fill-opacity="0.45"/>
    <rect x="1125" y="450" width="40" height="48" rx="4" fill="#c8881a" fill-opacity="0.55"/>
    <rect x="1075" y="520" width="40" height="48" rx="4" fill="#0f766e" fill-opacity="0.5"/>
    <rect x="1125" y="520" width="40" height="48" rx="4" fill="#fbf1dc" fill-opacity="0.35"/>
  </g>

  <!-- Community connection nodes -->
  <g stroke="#fbf1dc" stroke-opacity="0.35" stroke-width="2">
    <path d="M800 540 C920 460, 1040 490, 1140 400"/>
    <path d="M960 630 C1080 560, 1200 590, 1330 500"/>
    <path d="M840 700 C980 650, 1120 710, 1260 620"/>
  </g>
  <g fill="#fbf1dc">
    <circle cx="800" cy="540" r="9" fill-opacity="0.75"/>
    <circle cx="960" cy="630" r="8" fill-opacity="0.65"/>
    <circle cx="1140" cy="400" r="10" fill-opacity="0.85"/>
    <circle cx="1330" cy="500" r="9" fill-opacity="0.7"/>
    <circle cx="1260" cy="620" r="8" fill-opacity="0.6"/>
    <circle cx="840" cy="700" r="7" fill-opacity="0.5"/>
  </g>
  <g fill="#c8881a">
    <circle cx="980" cy="470" r="5" fill-opacity="0.8"/>
    <circle cx="1180" cy="560" r="5" fill-opacity="0.7"/>
  </g>

  <!-- Stylized phone / chat cue -->
  <g transform="translate(1410 580)">
    <rect x="0" y="0" width="78" height="130" rx="16" fill="#f7f3ec" fill-opacity="0.28" stroke="#fbf1dc" stroke-opacity="0.65" stroke-width="2.5"/>
    <rect x="12" y="18" width="54" height="78" rx="7" fill="#0f766e" fill-opacity="0.75"/>
    <rect x="20" y="30" width="38" height="10" rx="3" fill="#fbf1dc" fill-opacity="0.45"/>
    <rect x="20" y="48" width="28" height="8" rx="3" fill="#c8881a" fill-opacity="0.7"/>
    <circle cx="39" cy="114" r="6" fill="#fbf1dc" fill-opacity="0.7"/>
  </g>
</svg>
